<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="goldBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1c5"/>
      <stop offset="40%" stop-color="#dfb15b"/>
      <stop offset="80%" stop-color="#a36e1b"/>
      <stop offset="100%" stop-color="#694308"/>
    </linearGradient>
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#ffeaa7"/>
      <stop offset="70%" stop-color="#dfb15b"/>
      <stop offset="100%" stop-color="#a8751a"/>
    </linearGradient>
    <radialGradient id="roseRed" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ff4757"/>
      <stop offset="50%" stop-color="#c0392b"/>
      <stop offset="100%" stop-color="#4b0a12"/>
    </radialGradient>
    <radialGradient id="roseDark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c0392b"/>
      <stop offset="70%" stop-color="#7e0e1e"/>
      <stop offset="100%" stop-color="#2a0308"/>
    </radialGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="250" cy="420" rx="200" ry="40" fill="rgba(0,0,0,0.6)"/>

  <!-- Red Velvet Roses at Base -->
  <g transform="translate(40, 290)">
    <!-- Rose 1 -->
    <g transform="translate(40, 40)">
      <circle cx="50" cy="50" r="45" fill="url(#roseDark)"/>
      <circle cx="50" cy="50" r="35" fill="url(#roseRed)"/>
      <path d="M30,45 C30,30 65,30 65,45 C65,65 30,65 30,45 Z" fill="#ff4757" opacity="0.8"/>
      <circle cx="50" cy="50" r="16" fill="#7e0e1e"/>
    </g>

    <!-- Rose 2 -->
    <g transform="translate(110, 60)">
      <circle cx="50" cy="50" r="50" fill="url(#roseDark)"/>
      <circle cx="50" cy="50" r="40" fill="url(#roseRed)"/>
      <path d="M28,45 C28,25 70,25 70,45 C70,70 28,70 28,45 Z" fill="#ff4757" opacity="0.85"/>
      <circle cx="50" cy="50" r="18" fill="#7e0e1e"/>
    </g>

    <!-- Rose 3 -->
    <g transform="translate(190, 70)">
      <circle cx="50" cy="50" r="45" fill="url(#roseDark)"/>
      <circle cx="50" cy="50" r="35" fill="url(#roseRed)"/>
      <path d="M32,45 C32,30 65,30 65,45 C65,65 32,65 32,45 Z" fill="#ff4757" opacity="0.8"/>
      <circle cx="50" cy="50" r="16" fill="#7e0e1e"/>
    </g>

    <!-- Rose 4 -->
    <g transform="translate(260, 40)">
      <circle cx="50" cy="50" r="48" fill="url(#roseDark)"/>
      <circle cx="50" cy="50" r="38" fill="url(#roseRed)"/>
      <path d="M30,45 C30,28 68,28 68,45 C68,68 30,68 30,45 Z" fill="#ff4757" opacity="0.85"/>
      <circle cx="50" cy="50" r="17" fill="#7e0e1e"/>
    </g>
  </g>

  <!-- Luxury 3D Gold Gift Box -->
  <g transform="translate(125, 90)">
    <!-- Box Body -->
    <polygon points="50,170 200,210 200,320 50,270" fill="url(#goldBox)"/>
    <polygon points="200,210 320,165 320,270 200,320" fill="#a36e1b"/>
    
    <!-- Box Lid -->
    <polygon points="40,155 200,200 330,150 170,115" fill="url(#goldRibbon)"/>
    <polygon points="40,155 200,200 200,215 40,170" fill="url(#goldBox)"/>
    <polygon points="200,200 330,150 330,165 200,215" fill="#8a5b12"/>

    <!-- Vertical Ribbon on front -->
    <polygon points="120,188 140,194 140,300 120,293" fill="url(#goldRibbon)"/>
    <polygon points="255,188 272,182 272,290 255,297" fill="url(#goldRibbon)"/>

    <!-- Ribbon on Lid -->
    <polygon points="100,135 120,140 250,170 230,165" fill="#ffffff" opacity="0.4"/>
    <polygon points="140,178 156,183 285,134 270,130" fill="#ffffff" opacity="0.4"/>

    <!-- Lavish Satin Bow on Top -->
    <!-- Left Loop -->
    <path d="M185,155 C120,80 100,120 185,155 Z" fill="url(#goldRibbon)" stroke="#744a07" stroke-width="1"/>
    <!-- Right Loop -->
    <path d="M185,155 C250,80 270,120 185,155 Z" fill="url(#goldRibbon)" stroke="#744a07" stroke-width="1"/>
    <!-- Center Knot -->
    <ellipse cx="185" cy="155" rx="18" ry="14" fill="url(#goldRibbon)" stroke="#523303" stroke-width="1.5"/>
    <!-- Hanging Tails -->
    <path d="M180,160 Q150,210 140,240 Q150,230 175,190 Z" fill="url(#goldRibbon)"/>
    <path d="M190,160 Q220,210 230,240 Q220,230 195,190 Z" fill="url(#goldRibbon)"/>
  </g>
</svg>
