<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="100%">
  <defs>
    <radialGradient id="primeBasicGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#3a2512"/>
      <stop offset="50%" stop-color="#191008"/>
      <stop offset="100%" stop-color="#0a0603"/>
    </radialGradient>
    <linearGradient id="goldScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1c5"/>
      <stop offset="50%" stop-color="#dfb15b"/>
      <stop offset="100%" stop-color="#a36e1b"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#primeBasicGlow)"/>

  <!-- Grand Curved Cinema Screen -->
  <path d="M100,50 Q320,65 540,50 L530,220 Q320,240 110,220 Z" fill="#120b06" stroke="#dfb15b" stroke-width="2"/>
  <path d="M115,60 Q320,73 525,60 L515,210 Q320,228 125,210 Z" fill="#241407"/>

  <!-- Screen Content: Gold Glowing Moments Galaxy Monogram -->
  <circle cx="320" cy="135" r="40" fill="none" stroke="url(#goldScreen)" stroke-width="2.5" opacity="0.8"/>
  <text x="320" y="142" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="700" fill="url(#goldScreen)" text-anchor="middle" filter="drop-shadow(0 0 10px #dfb15b)">MG</text>
  <text x="320" y="170" font-family="Arial, sans-serif" font-size="11" letter-spacing="5" fill="#f5cd79" text-anchor="middle">PRIME THEATER</text>

  <!-- Side Acoustic Luxury Wood/Bronze Paneling with warm light scones -->
  <g fill="#331c0d">
    <rect x="20" y="40" width="60" height="260" rx="4"/>
    <circle cx="50" cy="90" r="10" fill="#dfb15b" opacity="0.6"/>
    <circle cx="50" cy="170" r="10" fill="#dfb15b" opacity="0.6"/>

    <rect x="560" y="40" width="60" height="260" rx="4"/>
    <circle cx="590" cy="90" r="10" fill="#dfb15b" opacity="0.6"/>
    <circle cx="590" cy="170" r="10" fill="#dfb15b" opacity="0.6"/>
  </g>

  <!-- Multiple Row VIP Plush Recliners (Curved Auditorium layout) -->
  <!-- Back row -->
  <path d="M110,265 C170,255 470,255 530,265 L540,310 L100,310 Z" fill="#1f1107" stroke="#3d210c" stroke-width="1.5"/>
  <!-- Front row loungers with cup holders -->
  <path d="M50,320 C140,295 500,295 590,320 L600,400 L40,400 Z" fill="#180c05" stroke="#dfb15b" stroke-width="1.5"/>
  <circle cx="210" cy="345" r="12" fill="#0d0603" stroke="#dfb15b" stroke-width="1"/>
  <circle cx="430" cy="345" r="12" fill="#0d0603" stroke="#dfb15b" stroke-width="1"/>

  <!-- Play Button Overlay -->
  <circle cx="320" cy="200" r="36" fill="rgba(18, 11, 6, 0.85)" stroke="#dfb15b" stroke-width="2"/>
  <polygon points="314,188 334,200 314,212" fill="url(#goldScreen)"/>
</svg>
