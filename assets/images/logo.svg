<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" width="100%" height="100%">
  <defs>
    <linearGradient id="logoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5d0"/>
      <stop offset="45%" stop-color="#dfb15b"/>
      <stop offset="85%" stop-color="#b88328"/>
      <stop offset="100%" stop-color="#fcedb8"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Orbital Galaxy Ring -->
  <ellipse cx="140" cy="46" rx="90" ry="16" fill="none" stroke="url(#logoGold)" stroke-width="1.2" opacity="0.6" transform="rotate(-6, 140, 46)"/>
  
  <!-- Tiny Sparkle on Orbit -->
  <polygon points="228,40 230,44 234,45 230,46 228,50 226,46 222,45 226,44" fill="#ffffff" filter="url(#logoGlow)"/>
  <polygon points="50,48 51,51 54,52 51,53 50,56 49,53 46,52 49,51" fill="#ffeaa7"/>

  <!-- "Moments" wordmark -->
  <text x="140" y="38" font-family="'Playfair Display', 'Cinzel', Georgia, serif" font-size="34" font-weight="700" letter-spacing="1" fill="url(#logoGold)" text-anchor="middle" filter="url(#logoGlow)">Moments</text>

  <!-- "galaxy" lowercase wordmark with trailing star -->
  <text x="136" y="62" font-family="'Cinzel', 'Playfair Display', serif" font-size="18" font-weight="600" letter-spacing="4" fill="#f5cd79" text-anchor="middle">galaxy</text>
  
  <!-- Trailing Star near galaxy -->
  <polygon points="186,55 188,58 192,59 188,60 186,63 184,60 180,59 184,58" fill="#ffeaa7"/>
</svg>
