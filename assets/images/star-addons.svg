<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="100%">
  <defs>
    <radialGradient id="neonGlow" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#1e1548"/>
      <stop offset="60%" stop-color="#0e0a24"/>
      <stop offset="100%" stop-color="#05030d"/>
    </radialGradient>
    <linearGradient id="neonStrip" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3867d6"/>
      <stop offset="50%" stop-color="#8854d0"/>
      <stop offset="100%" stop-color="#00d2d3"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#neonGlow)"/>

  <!-- Starry Ceiling Effect -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="100" cy="30" r="1.5"/><circle cx="180" cy="20" r="1"/><circle cx="260" cy="40" r="2"/>
    <circle cx="350" cy="25" r="1.5"/><circle cx="430" cy="35" r="1"/><circle cx="520" cy="20" r="2"/>
    <circle cx="140" cy="60" r="1"/><circle cx="490" cy="50" r="1.5"/><circle cx="300" cy="15" r="1"/>
  </g>

  <!-- Big Cinema Screen with Moments Galaxy Logo -->
  <rect x="130" y="45" width="380" height="200" rx="6" fill="#090518" stroke="#4b7bec" stroke-width="2"/>
  <rect x="140" y="55" width="360" height="180" fill="#130d36"/>
  <text x="320" y="145" font-family="'Playfair Display', Georgia, serif" font-size="34" font-weight="700" fill="#ffffff" text-anchor="middle" filter="drop-shadow(0 0 12px #3867d6)">Moments</text>
  <text x="320" y="175" font-family="Arial, sans-serif" font-size="16" letter-spacing="6" fill="#45aaf2" text-anchor="middle">GALAXY</text>

  <!-- Neon Vertical Lighting Pillars on Side Walls -->
  <rect x="50" y="50" width="8" height="260" fill="url(#neonStrip)" filter="drop-shadow(0 0 10px #8854d0)"/>
  <rect x="580" y="50" width="8" height="260" fill="url(#neonStrip)" filter="drop-shadow(0 0 10px #8854d0)"/>
  <rect x="90" y="70" width="6" height="220" fill="url(#neonStrip)" opacity="0.7"/>
  <rect x="540" y="70" width="6" height="220" fill="url(#neonStrip)" opacity="0.7"/>

  <!-- Luxury Double Recliner Loungers in Purple/Navy Leather -->
  <path d="M70,310 C140,290 260,290 310,320 L310,400 L60,400 Z" fill="#181335" stroke="#3867d6" stroke-width="1.5"/>
  <path d="M330,320 C380,290 500,290 570,310 L580,400 L330,400 Z" fill="#181335" stroke="#3867d6" stroke-width="1.5"/>

  <!-- Plump Pillows with metallic shine -->
  <ellipse cx="140" cy="330" rx="30" ry="18" fill="#4b7bec" opacity="0.8"/>
  <ellipse cx="500" cy="330" rx="30" ry="18" fill="#8854d0" opacity="0.8"/>

  <!-- Play Button Overlay -->
  <circle cx="320" cy="200" r="36" fill="rgba(14, 10, 36, 0.8)" stroke="#45aaf2" stroke-width="2"/>
  <polygon points="314,188 334,200 314,212" fill="#ffffff"/>
</svg>
