<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="100%">
  <defs>
    <radialGradient id="noticeGlow" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#192a56"/>
      <stop offset="60%" stop-color="#0c1024"/>
      <stop offset="100%" stop-color="#04060d"/>
    </radialGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffeaa7"/>
      <stop offset="100%" stop-color="#dfb15b"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#noticeGlow)"/>

  <!-- Private Theater Room Background -->
  <!-- Ambient Blue Wall Panels -->
  <rect x="40" y="30" width="560" height="340" rx="12" fill="#0f162e" stroke="#273c75" stroke-width="2"/>
  
  <!-- Glowing Neon Neon Frame -->
  <rect x="100" y="60" width="440" height="200" rx="8" fill="#080c1a" stroke="#00a8ff" stroke-width="2" filter="drop-shadow(0 0 12px #00a8ff)"/>

  <!-- Notice Details Graphics on Screen -->
  <g transform="translate(130, 90)">
    <circle cx="20" cy="20" r="14" fill="#dfb15b"/>
    <text x="20" y="25" font-family="Arial" font-size="16" font-weight="bold" fill="#000" text-anchor="middle">!</text>
    <text x="50" y="26" font-family="'Playfair Display', Georgia, serif" font-size="20" font-weight="700" fill="url(#goldText)">MOMENTS GALAXY GUIDELINES</text>

    <!-- Rule 1 -->
    <circle cx="20" cy="55" r="4" fill="#4cd137"/>
    <text x="35" y="58" font-family="Arial, sans-serif" font-size="12" fill="#dcdde1">Arrive 10 minutes prior to slot</text>

    <!-- Rule 2 -->
    <circle cx="20" cy="80" r="4" fill="#4cd137"/>
    <text x="35" y="83" font-family="Arial, sans-serif" font-size="12" fill="#dcdde1">Own movies / OTT streaming supported</text>

    <!-- Rule 3 -->
    <circle cx="20" cy="105" r="4" fill="#4cd137"/>
    <text x="35" y="108" font-family="Arial, sans-serif" font-size="12" fill="#dcdde1">Cake celebration & photography allowed</text>

    <!-- Rule 4 -->
    <circle cx="20" cy="130" r="4" fill="#4cd137"/>
    <text x="35" y="133" font-family="Arial, sans-serif" font-size="12" fill="#dcdde1">Cozy private room with complete privacy</text>
  </g>

  <!-- Big Play Button Overlay -->
  <circle cx="320" cy="210" r="42" fill="rgba(8, 12, 26, 0.85)" stroke="#00a8ff" stroke-width="2"/>
  <polygon points="314,196 336,210 314,224" fill="#00d2d3"/>

  <!-- Duration Badge inside poster -->
  <rect x="520" y="330" width="65" height="26" rx="13" fill="rgba(0,0,0,0.8)" stroke="#dfb15b" stroke-width="1"/>
  <text x="552" y="347" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">00:48</text>
</svg>
